name: WinUI 3 CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild TrustedMaster.csproj /t:Restore /p:Configuration=${{ matrix.configuration }}

    - name: Build and Package
      run: >
        msbuild TrustedMaster.csproj
        /p:Configuration=${{ matrix.configuration }}
        /p:Platform=${{ matrix.platform }}
        /p:RuntimeIdentifier=win-${{ matrix.platform }}
        /p:SelfContained=true
        /p:PublishProfile=
        /p:UapAppxPackageBuildMode=SideloadOnly
        /p:AppxBundle=Never
        /p:GenerateAppxPackageOnBuild=true

    - name: Upload MSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MSIX-Package-${{ matrix.platform }}
        path: Packages
        if-no-files-found: error

    - name: Write Job Summary
      if: always()
      shell: pwsh
      run: |
        $artifactUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        $files = Get-ChildItem -Path "Packages" -Recurse -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Extension -in ".msix", ".msixbundle", ".appx", ".appxbundle" }

        $summary = @()
        $summary += "## Build Summary"
        $summary += ""
        $summary += "| Item | Value |"
        $summary += "|------|-------|"
        $summary += "| Configuration | ``${{ matrix.configuration }}`` |"
        $summary += "| Platform | ``${{ matrix.platform }}`` |"
        $summary += "| Commit | ``${{ github.sha }}`` |"
        $summary += "| Run | [${{ github.run_id }}]($artifactUrl) |"
        $summary += ""
        $summary += "## Artifacts"
        $summary += ""

        if ($files.Count -eq 0) {
          $summary += "> No MSIX package was produced."
        } else {
          $summary += "| File | Size (MB) |"
          $summary += "|------|-----------|"
          foreach ($f in $files) {
            $sizeMB = [math]::Round($f.Length / 1MB, 2)
            $summary += "| ``$($f.Name)`` | $sizeMB |"
          }
          $summary += ""
          $summary += "Download from the **Artifacts** section at the bottom of this page."
        }

        $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
